[project]
name = "tradingbot"
version = "0.1.0"
description = "MVP trading platform: research, backtest, risk, paper trading (MT5 demo)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "plotly>=5.20",
    "matplotlib>=3.8",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "tabulate>=0.9",
]

[project.optional-dependencies]
# MetaTrader5's Python package is Windows-only; install on the machine that runs MT5:
#   uv sync --extra mt5
mt5 = ["MetaTrader5>=5.0.45; sys_platform == 'win32'"]

[project.scripts]
tb-data = "tradingbot.data.cli:main"
tb-backtest = "tradingbot.backtesting.cli:main"
tb-research = "tradingbot.research.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tradingbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
